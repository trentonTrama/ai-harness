name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown and frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for broken relative links in skills
        run: |
          fail=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            # pull out markdown link targets that are relative paths
            grep -oE '\]\([^)#][^)]*\)' "$file" \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*$//' \
              | grep -vE '^(https?:|mailto:)' \
              | while read -r target; do
                  [ -z "$target" ] && continue
                  if [ ! -e "$dir/$target" ]; then
                    echo "::error file=$file::broken relative link: $target"
                    exit 1
                  fi
                done || fail=1
          done < <(find plugins -name '*.md')
          exit $fail

      - name: Check for trailing whitespace and tabs
        run: |
          if grep -rIn '[[:space:]]$' --include='*.md' --include='*.json' plugins .claude-plugin; then
            echo "::error::trailing whitespace found"
            exit 1
          fi
